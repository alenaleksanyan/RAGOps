services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: ragbench-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ragbench-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragbench-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragbench-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache
    command: python -m arq app.workers.arq_worker.WorkerSettings

  ollama:
    image: ollama/ollama:latest
    container_name: ragbench-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    container_name: ragbench-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL}
      - OLLAMA_DEFAULT_EMBEDDING_MODEL=${OLLAMA_DEFAULT_EMBEDDING_MODEL}
      - EVAL_LLM_MODEL=${EVAL_LLM_MODEL}
    entrypoint: >
      sh -c "
        echo '=== [Ollama Init] Waiting for Ollama service to start ===';
        if [ -n \"$$OLLAMA_DEFAULT_MODEL\" ]; then
          echo \"[Ollama Init] Auto-pulling default model: $$OLLAMA_DEFAULT_MODEL...\";
          ollama pull $$OLLAMA_DEFAULT_MODEL || true;
        fi;
        if [ -n \"$$OLLAMA_DEFAULT_EMBEDDING_MODEL\" ]; then
          echo \"[Ollama Init] Auto-pulling embedding model: $$OLLAMA_DEFAULT_EMBEDDING_MODEL...\";
          ollama pull $$OLLAMA_DEFAULT_EMBEDDING_MODEL || true;
        fi;
        if [ -n \"$$EVAL_LLM_MODEL\" ] && [ \"$$EVAL_LLM_MODEL\" != \"$$OLLAMA_DEFAULT_MODEL\" ]; then
          echo \"[Ollama Init] Auto-pulling evaluator model: $$EVAL_LLM_MODEL...\";
          ollama pull $$EVAL_LLM_MODEL || true;
        fi;
        echo '=== [Ollama Init] All configured models ready! ===';
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragbench-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  hf_cache:
